name: Delete PR preview

on:
  pull_request:
    types: [closed]

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the docs deployer role through OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::014498646868:role/docs-deployer-role
          aws-region: us-east-1

      - name: Delete PR preview
        run: aws s3 rm s3://validmind-docs-staging/site/pr_previews/${{ github.head_ref }}/ --recursive && aws cloudfront create-invalidation --distribution-id ESWVTZYFL873V --paths "/*" --no-cli-pager > /dev/null
